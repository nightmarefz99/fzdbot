[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fzdbot"
version = "0.2.0"
description = "A Discord bot for tracking and displaying scores, integrated with a database"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nightmare", email = "tromnick@yahoo.com" }]
requires-python = ">=3.9"

dependencies = [
    "discord.py>=2.0",
    "mysql-connector-python>=9.3,<10.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.6.9"]

[tool.ruff]
target-version = "py312"
line-length = 114
extend-exclude = [
    ".venv",
    ".uv-cache",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]

[project.scripts]
fzdbot = "fzdbot.bot:main"
