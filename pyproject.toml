[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fzdbot"
version = "0.2.0"
description = "A Discord bot for tracking and displaying scores, integrated with a database"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nightmare", email = "tromnick@yahoo.com" }]
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "cryptography",
]

[project.scripts]
fzdbot = "fzdbot.main:main"

[dependency-groups]
dev = ["ruff>=0.6.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fzdbot"]

[tool.ruff]
target-version = "py312"
line-length = 114
extend-exclude = [
    ".venv",
    ".uv-cache",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]
